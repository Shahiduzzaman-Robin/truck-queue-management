<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - Truck Queue System</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            padding: 40px 20px;
            color: #1a1a1a;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .back-btn {
            text-decoration: none;
            color: #666;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: #1a1a1a;
        }

        .filters {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
        }

        .filter-input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
            min-width: 160px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            border: none;
            transition: background 0.2s;
            height: 35px;
            margin-top: 18px;
            /* Align with inputs */
        }

        .btn-primary {
            background: #1a1a1a;
            color: white;
        }

        .btn-primary:hover {
            background: #333;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e5e5e5;
        }

        .card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
            padding-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 16px;
            background: #f5f5f5;
            border-bottom: 2px solid #e5e5e5;
            font-weight: 600;
            font-size: 0.9rem;
            color: #444;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
            vertical-align: top;
        }

        tr:hover {
            background: #fcfcfc;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-login {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-logout {
            background: #f3f4f6;
            color: #374151;
        }

        .badge-truck {
            background: #dcfce7;
            color: #166534;
        }

        .badge-admin {
            background: #fce7f3;
            color: #9d174d;
        }

        .badge-delete {
            background: #fee2e2;
            color: #991b1b;
        }

        pre {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid #eee;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .meta {
            color: #888;
            font-size: 0.8rem;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
            <h1>📜 Audit Logs</h1>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="userFilter">User</label>
                <select id="userFilter" class="filter-input">
                    <option value="">All Users</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" class="filter-input">
            </div>

            <div class="filter-group">
                <label for="endDate">End Date</label>
                <input type="date" id="endDate" class="filter-input">
            </div>

            <button onclick="loadLogs()" class="btn btn-primary">Filter</button>
            <button onclick="resetFilters()" class="btn btn-secondary">Reset</button>
        </div>

        <div class="card">
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 180px;">Time</th>
                            <th style="width: 150px;">User</th>
                            <th style="width: 150px;">Action</th>
                            <th style="width: 150px;">Warehouse</th>
                            <th style="width: 100px;">Target ID</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center; color: #999;">Loading logs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Use Set to store unique usernames seen in logs or fetch from API
        // For simplicity, let's fetch all admins to populate the dropdown
        async function loadUsers() {
            try {
                const response = await fetch('/api/admin');
                const data = await response.json();
                if (data.success) {
                    const select = document.getElementById('userFilter');
                    data.admins.forEach(admin => {
                        const option = document.createElement('option');
                        option.value = admin.username;
                        option.textContent = admin.username;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Failed to load users:', error);
            }
        }

        let warehousesMap = {};
        async function loadWarehouses() {
            try {
                const response = await fetch('/api/warehouses');
                const data = await response.json();
                if (data.success) {
                    data.warehouses.forEach(w => {
                        warehousesMap[w.id] = w.name;
                    });
                }
            } catch (error) {
                console.error('Failed to load warehouses:', error);
            }
        }

        async function loadLogs() {
            const tbody = document.getElementById('logsTableBody');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999;">Loading...</td></tr>';

            const username = document.getElementById('userFilter').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            const params = new URLSearchParams({ limit: 100 });
            if (username) params.append('username', username);
            if (startDate) params.append('startDate', startDate);
            if (endDate) params.append('endDate', endDate);

            try {
                const response = await fetch(`/api/admin/logs?${params.toString()}`);
                const data = await response.json();

                if (data.success) {
                    renderLogs(data.logs);
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">${data.message || 'Error loading logs'}</td></tr>`;
                }
            } catch (error) {
                console.error('Error:', error);
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">Failed to connect to server</td></tr>`;
            }
        }

        function renderLogs(logs) {
            const tbody = document.getElementById('logsTableBody');
            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999;">No logs found matching filters</td></tr>';
                return;
            }

            tbody.innerHTML = logs.map(log => {
                const date = new Date(log.created_at).toLocaleString();
                let badgeClass = '';
                if (log.action.includes('LOGIN')) badgeClass = 'badge-login';
                else if (log.action.includes('LOGOUT')) badgeClass = 'badge-logout';
                else if (log.action.includes('TRUCK')) badgeClass = 'badge-truck';
                else if (log.action.includes('ADMIN')) badgeClass = 'badge-admin';
                else if (log.action.includes('DELETE')) badgeClass = 'badge-delete';

                const details = typeof log.details === 'string' ? log.details : JSON.stringify(log.details, null, 2);

                // Parse details if it's a string to access properties
                let detailsObj = {};
                try {
                    detailsObj = typeof log.details === 'string' ? JSON.parse(log.details) : (log.details || {});
                } catch (e) {
                    detailsObj = {};
                }

                // Try to find warehouse name in details or map from ID
                let warehouseName = '-';
                if (detailsObj.warehouse_name) {
                    warehouseName = detailsObj.warehouse_name;
                } else if (detailsObj.warehouse_id && warehousesMap[detailsObj.warehouse_id]) {
                    warehouseName = warehousesMap[detailsObj.warehouse_id];
                }

                return `
                    <tr>
                        <td>${date}</td>
                        <td>
                            <strong>${log.username || 'System'}</strong>
                            ${log.user_id ? `<div class="meta">ID: ${log.user_id}</div>` : ''}
                        </td>
                        <td><span class="badge ${badgeClass}">${log.action}</span></td>
                        <td>${warehouseName}</td>
                        <td>${log.target_id || '-'}</td>
                        <td>
                            ${details !== '{}' ? `<pre>${details}</pre>` : '<span style="color:#ccc">No details</span>'}
                            <div class="meta">IP: ${log.ip_address}</div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function resetFilters() {
            document.getElementById('userFilter').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            loadLogs();
        }

        // Initialize
        loadUsers();
        loadWarehouses().then(loadLogs);
    </script>
</body>

</html>
